<style>
  :root {
    --paper: #eae5e1;
    --ink: #141210;
    --ink-dim: #6f6a64;
    --amber: #e07b39;
    --hairline: rgba(20,18,16,.14);
    --mono: "MiSans", "PingFang SC", "Microsoft YaHei", ui-monospace, SFMono-Regular, Menlo, monospace;
    --sans: "MiSans", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    --ease: cubic-bezier(0.16, 1, 0.3, 1);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body { background: var(--paper); color: var(--ink); font-family: var(--sans); overflow: hidden; }
  #gl { position: fixed; inset: 0; display: block; }
  #vignette { position: fixed; inset: 0; pointer-events: none; z-index: 2;
    background: radial-gradient(ellipse at 50% 42%, transparent 55%, rgba(20,18,16,.10) 100%); }

  .hud { position: fixed; z-index: 10; font-family: var(--mono); }
  #hud-top { top: 0; left: 0; right: 0; height: 52px; display: flex; align-items: center; gap: 18px;
    padding: 0 20px; border-bottom: 1px solid var(--hairline);
    background: color-mix(in srgb, var(--paper) 72%, transparent); backdrop-filter: blur(10px); }
  #hud-top .brand { font-size: 12px; font-weight: 600; letter-spacing: .28em; }
  #hud-top .brand em { font-style: normal; color: var(--amber); }
  #hud-top .pos { font-size: 10px; letter-spacing: .2em; color: var(--ink-dim); }
  #hud-top .pos b { color: var(--amber); font-weight: 600; }
  #hud-top .spacer { flex: 1; }
  #hud-top .cat { font-size: 10px; letter-spacing: .24em; color: var(--ink-dim); text-transform: uppercase; }
  .topbtn { font-family: var(--mono); font-size: 10px; letter-spacing: .22em; text-transform: uppercase;
    padding: 7px 12px; border: 1px solid var(--hairline); color: var(--ink-dim); cursor: pointer;
    transition: border-color .2s var(--ease), color .2s var(--ease); }
  .topbtn:hover, .topbtn:focus-visible { border-color: var(--ink); color: var(--ink); outline: none; }
  .topbtn:focus-visible { box-shadow: 0 0 0 2px var(--amber); }
  .topbtn b { color: var(--amber); font-weight: 600; }

  #hud-sel { left: 20px; top: 72px; }
  #hud-sel .no { font-size: 12px; letter-spacing: .2em; color: var(--amber); font-weight: 600; }
  #hud-sel .t { font-family: var(--sans); font-size: 22px; font-weight: 600; margin-top: 6px; transition: opacity .14s; }
  #hud-sel .t.flick { opacity: .1; }
  #hud-sel .en { font-size: 9px; letter-spacing: .24em; color: var(--ink-dim); margin-top: 4px; text-transform: uppercase; }

  #hud-bottom { bottom: 0; left: 0; right: 0; height: 42px; display: flex; align-items: center; gap: 20px;
    padding: 0 20px; border-top: 1px solid var(--hairline); overflow-x: auto;
    background: color-mix(in srgb, var(--paper) 72%, transparent); backdrop-filter: blur(10px); }
  #hud-bottom span { font-size: 9px; letter-spacing: .16em; color: var(--ink-dim); text-transform: uppercase; white-space: nowrap; }
  #hud-bottom b { color: var(--ink); }

  #detail { position: fixed; z-index: 10; top: 52px; right: 0; bottom: 42px; width: min(380px, 88vw);
    border-left: 1px solid var(--hairline); padding: 28px 26px;
    background: color-mix(in srgb, var(--paper) 82%, transparent); backdrop-filter: blur(12px);
    transform: translateX(102%); transition: transform 480ms var(--ease); overflow-y: auto; }
  #detail.on { transform: none; }
  #detail .lbl { font-family: var(--mono); font-size: 9px; letter-spacing: .3em; color: var(--ink-dim); text-transform: uppercase; }
  #detail .did { font-family: var(--mono); font-size: 13px; letter-spacing: .18em; color: var(--amber); font-weight: 600; margin-top: 14px; }
  #detail h1 { font-size: 24px; font-weight: 600; margin: 8px 0 4px; }
  #detail .den { font-family: var(--mono); font-size: 10px; letter-spacing: .2em; color: var(--ink-dim); text-transform: uppercase; }
  #detail .kv { display: flex; justify-content: space-between; padding: 9px 0; border-top: 1px solid var(--hairline); font-size: 12px; margin-top: 16px; }
  #detail .kv .k { font-family: var(--mono); font-size: 9px; letter-spacing: .2em; color: var(--ink-dim); text-transform: uppercase; padding-top: 2px; }
  #detail .body { font-size: 13px; line-height: 2; color: #33302c; margin-top: 16px; }
  #detail .tip { font-family: var(--mono); font-size: 9px; letter-spacing: .2em; color: var(--ink-dim); margin-top: 22px; text-transform: uppercase; }

  #boot { position: fixed; inset: 0; z-index: 50; background: var(--paper); display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 14px; transition: opacity 500ms var(--ease); }
  #boot.off { opacity: 0; pointer-events: none; }
  #boot .t { font-family: var(--mono); font-size: 11px; letter-spacing: .4em; color: var(--ink-dim); text-transform: uppercase; }
  #boot .bar { width: 180px; height: 1px; background: var(--hairline); position: relative; overflow: hidden; }
  #boot .bar i { position: absolute; left: 0; top: 0; bottom: 0; width: 30%; background: var(--amber); animation: load 1.2s var(--ease) infinite; }
  @keyframes load { 0% { left: -30%; } 100% { left: 100%; } }
  #boot .err { color: var(--amber); font-size: 13px; max-width: 460px; text-align: center; line-height: 1.8; display: none; }
  #boot .note { font-family: var(--mono); font-size: 9px; letter-spacing: .18em; color: var(--ink-dim); text-transform: uppercase; }

  #credit { position: fixed; left: 16px; bottom: 52px; z-index: 5; font-family: var(--mono); font-size: 9px;
    letter-spacing: .1em; color: var(--ink-dim); text-transform: uppercase; opacity: .8; pointer-events: none; }
  #credit b { color: var(--amber); }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: 1ms !important; transition-duration: 1ms !important; }
  }
</style>

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
const bootEl = document.getElementById('boot');
const bootText = document.getElementById('boot-text');
const errEl = document.getElementById('boot-err');

/* ============ 数据（与 DEMO 02/03 同源节选） ============ */
const CATS = [
  ['文章', 'ARTICLES', 'A', ['线段树从入门到进阶','React 19 服务端组件实战','如何读一份开源代码','动态规划的状态设计','TypeScript 类型体操入门','从 CORS 到 BFF 网关','操作系统内存管理笔记','写给新人的 Git 工作流']],
  ['视频', 'VIDEOS', 'V', ['2026 暑期算法营·第 1 讲','CSS 布局大师课','一次讲透 HTTPS 握手','递归思维训练（上）','递归思维训练（下）','数据库索引为什么快','Linux 命令行 survival','期中复习串讲·数学']],
  ['工具', 'TOOLS', 'T', ['在线判题 Sandbox','代码对比 Diff 器','正则表达式试验场','Cron 表达式生成器','Markdown 速查表','JSON 结构化检视器','调色板对比度检查','算法复杂度速查']],
  ['活动', 'EVENTS', 'E', ['九月新生破冰赛','周五夜读·SICP','秋季项目路演','国庆集训营报名','开源之夏宣讲会','月度 Code Review 会','黑客松·48 小时','毕业学长分享夜']],
  ['特别策划', 'SPECIAL', 'S', ['CS 学习路线图 2026','档案柜：本站资源总索引','暑期成果展·作品集','内部知识库建设日志','新手三十天打卡计划','术语表：从 API 到 WASM','年度技术雷达','社区共建白皮书']]
];
const EN = ['SEGMENT TREE','RSC PRACTICE','OPEN SOURCE','DP STATES','TS TYPES','BFF GATEWAY','OS MEMORY','GIT 101'];
const item = (c, i) => ({ id: CATS[c][2] + '-' + String(i + 1).padStart(3, '0'), title: CATS[c][3][i], en: EN[i], cat: c, idx: i });

/* ============ 画质档位（对齐上游 render-quality：high/medium/low） ============ */
const QUALITY = {
  HIGH:   { label: 'HIGH',   pr: 2,   transmission: 1,    rows: 8, cards: 40 },
  MEDIUM: { label: 'MEDIUM', pr: 1.5, transmission: 0.65, rows: 8, cards: 40 },
  LOW:    { label: 'LOW',    pr: 1,   transmission: 0,    rows: 6, cards: 30 },
};
const QKEY = 'rhine-demo-quality';
let quality = QUALITY[localStorage.getItem(QKEY)] || QUALITY.HIGH;

/* ============ 场景常量 ============ */
const COLS = 5;
const CARD_W = 5, CARD_D = 0.62;
const COL_GAP = 5.4, ROW_GAP = 4.6;
const LIFT_PREVIEW = 0.9, LIFT_DETAIL = 4.05;
const PAPER = 0xeae5e1, AMBER = 0xe07b39;

try { await main(); } catch (e) { fail(e); }

function fail(e) {
  bootText.textContent = 'SCENE UNAVAILABLE';
  bootEl.querySelector('.bar').style.display = 'none';
  errEl.style.display = 'block';
  errEl.textContent = '无法初始化 WebGL2 场景（' + (e && e.message ? e.message : e) + '）。请使用支持 WebGL2 的桌面浏览器。';
  bootEl.classList.remove('off');
}

async function main() {
  const canvas = document.getElementById('gl');
  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
  if (!renderer.capabilities.isWebGL2) throw new Error('WebGL2 not supported');
  renderer.setPixelRatio(Math.min(devicePixelRatio, quality.pr));
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.0;

  const scene = new THREE.Scene();
  scene.background = new THREE.Color(PAPER);
  scene.fog = new THREE.Fog(PAPER, 34, 105);

  const pmrem = new THREE.PMREMGenerator(renderer);
  scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

  scene.add(new THREE.HemisphereLight(0xfff8ef, 0xd8cfc4, 0.5));
  const key = new THREE.DirectionalLight(0xfff4e6, 1.7); key.position.set(-8, 14, 4); scene.add(key);
  const fill = new THREE.DirectionalLight(0xffffff, 0.3); fill.position.set(10, 6, -8); scene.add(fill);

  /* ---- 档案盒：优先上游 GLB，失败回退程序化几何 ---- */
  let template = null, usingGlb = false;
  try {
    // 占位素材位于前端仓 public/rhine-lab/（见该目录 README）
    const gltf = await new GLTFLoader().loadAsync('/rhine-lab/archive-cassette.glb');
    template = normalize(gltf.scene);
    usingGlb = true;
  } catch (e) {
    console.warn('GLB 载入失败，回退程序化几何：', e);
    template = proceduralCard();
  }
  bootText.textContent = usingGlb ? 'LOADING ARCHIVE SCENE' : 'LOADING · FALLBACK GEOMETRY';

  /* 透射强度随画质档位调整（LOW 档关闭透射改用半透明） */
  template.traverse((o) => {
    if (!o.isMesh) return;
    const mats = Array.isArray(o.material) ? o.material : [o.material];
    mats.forEach((m) => {
      if (!m) return;
      if ('transmission' in m) {
        m.transmission = quality.transmission;
        if (quality.transmission === 0) { m.transparent = true; m.opacity = 0.88; }
        m.needsUpdate = true;
      }
    });
  });

  const cards = [];
  const root = new THREE.Group(); scene.add(root);
  const rows = quality.rows;
  for (let c = 0; c < COLS; c++) {
    for (let r = 0; r < rows; r++) {
      const grp = template.clone(true);
      grp.position.set((c - (COLS - 1) / 2) * COL_GAP, 0, (r - (rows - 1) / 2) * ROW_GAP);
      root.add(grp);
      cards.push({ grp, lift: 0, liftV: 0, yaw: 0, col: c, row: r, it: item(c, r), phase: Math.random() * Math.PI * 2 });
    }
  }

  /* ---- 相机 ---- */
  const camera = new THREE.PerspectiveCamera(24, innerWidth / innerHeight, 0.3, 240);
  const cam = { az: 59, el: 19, r: 36, tx: 0, ty: 0.8, tz: -2 };
  const from = { ...cam }, to = { ...cam };
  let camT = 1;
  const place = () => {
    const az = THREE.MathUtils.degToRad(cam.az), el = THREE.MathUtils.degToRad(cam.el);
    camera.position.set(cam.tx + cam.r * Math.cos(el) * Math.sin(az), cam.ty + cam.r * Math.sin(el), cam.tz + cam.r * Math.cos(el) * Math.cos(az));
    camera.lookAt(cam.tx, cam.ty, cam.tz);
  };
  const tween = (target, instant) => {
    Object.assign(from, cam); Object.assign(to, target);
    camT = instant || reduced ? 1 : 0;
    if (camT === 1) { Object.assign(cam, to); place(); }
  };
  const ease = (t) => 1 - Math.pow(1 - t, 4);

  /* ---- 选择与交互 ---- */
  const sel = { col: 0, row: 0, memory: CATS.map(() => 0) };
  let mode = 'browse';
  let wave = { t0: -10, col: 0, row: 0 };
  let lastAction = performance.now() / 1000;
  let clock = performance.now() / 1000;
  const selCard = () => cards[sel.col * rows + sel.row];
  const dist = (cd) => Math.abs(cd.col - sel.col) + Math.abs(cd.row - sel.row);

  function hud() {
    const it = selCard().it;
    document.getElementById('hud-pos').textContent = it.id;
    document.getElementById('hud-cat').textContent = '[ 0' + (it.cat + 1) + ' ] ' + CATS[it.cat][1];
    document.getElementById('sel-no').textContent = it.id;
    const t = document.getElementById('sel-title');
    t.textContent = it.title;
    document.getElementById('sel-en').textContent = it.en;
    if (!reduced) { t.classList.remove('flick'); void t.offsetWidth; t.classList.add('flick'); setTimeout(() => t.classList.remove('flick'), 180); }
  }

  function switchCol(d) {
    if (mode !== 'browse') return;
    sel.col = (sel.col + d + COLS) % COLS;
    sel.row = Math.min(sel.memory[sel.col], rows - 1);
    fire();
  }
  function switchRow(d) {
    if (mode !== 'browse') return;
    sel.row = (sel.row + d + rows) % rows;
    sel.memory[sel.col] = sel.row;
    fire();
  }
  function fire() { wave = { t0: clock, col: sel.col, row: sel.row }; lastAction = clock; hud(); }

  function openDetail() {
    if (mode !== 'browse') return;
    mode = 'detail-in';
    const cd = selCard();
    tween({ az: 18, el: 13.8, r: 15, tx: cd.grp.position.x + 3.6, ty: cd.grp.position.y + LIFT_DETAIL + 0.6, tz: cd.grp.position.z });
    const it = cd.it;
    document.getElementById('d-id').textContent = 'ARCHIVE ' + it.id;
    document.getElementById('d-title').textContent = it.title;
    document.getElementById('d-en').textContent = it.en;
    document.getElementById('d-owner').textContent = '教研组 / ' + CATS[it.cat][0];
    document.getElementById('d-cat').textContent = '[ 0' + (it.cat + 1) + ' ] ' + CATS[it.cat][0] + ' / ' + CATS[it.cat][1];
    document.getElementById('d-body').textContent =
      '档案「' + it.title + '」由透明档案盒封存，当前为抽取净空状态：镜头切至 18°/13.8° 特写，档案升至净空高度，可拖动检查角度；ESC 先转正再归位。' +
      (usingGlb ? '（模型为上游 GLB 占位，含磨砂聚合物盖板 / 琥珀光学镶嵌 / 光学扩散片等材质）' : '（GLB 未载入，当前为程序化兜底几何）');
    document.getElementById('detail').classList.add('on');
  }
  function closeDetail() {
    if (mode === 'detail' || mode === 'detail-in') { mode = 'detail-out'; document.getElementById('detail').classList.remove('on'); }
  }

  let drag = null;
  canvas.addEventListener('pointerdown', (e) => { if (mode === 'detail') drag = { x: e.clientX, yaw: selCard().yaw }; });
  addEventListener('pointermove', (e) => {
    if (drag) { const cd = selCard(); cd.yaw = THREE.MathUtils.clamp(drag.yaw + (e.clientX - drag.x) * 0.006, -0.8, 0.8); }
  });
  addEventListener('pointerup', () => { drag = null; });

  addEventListener('keydown', (e) => {
    if (e.key === 'ArrowLeft') switchCol(-1);
    else if (e.key === 'ArrowRight') switchCol(1);
    else if (e.key === 'ArrowUp') { e.preventDefault(); switchRow(-1); }
    else if (e.key === 'ArrowDown') { e.preventDefault(); switchRow(1); }
    else if (e.key === 'Enter') openDetail();
    else if (e.key === 'Escape') closeDetail();
    else if (e.key.toLowerCase() === 'q') cycleQuality();
  });

  /* ---- 画质切换（切换后重载页面以重建实例与材质） ---- */
  function cycleQuality() {
    const order = ['HIGH', 'MEDIUM', 'LOW'];
    const next = order[(order.indexOf(quality.label) + 1) % order.length];
    localStorage.setItem(QKEY, next);
    location.reload();
  }
  document.getElementById('btn-quality').addEventListener('click', cycleQuality);
  document.getElementById('q-label').textContent = quality.label;

  /* ---- 主循环 ---- */
  const spring = (x, v, target, dt, k, d) => {
    v += (target - x) * k * dt; v *= Math.exp(-d * dt); x += v * dt; return [x, v];
  };
  let prev = performance.now() / 1000;
  function frame() {
    requestAnimationFrame(frame);
    const now = performance.now() / 1000;
    const dt = Math.min(now - prev, 0.05); prev = now; clock = now;

    if (camT < 1) {
      camT = Math.min(1, camT + dt / 1.15);
      const e = ease(camT);
      for (const k of ['az', 'el', 'r', 'tx', 'ty', 'tz']) cam[k] = from[k] + (to[k] - from[k]) * e;
      place();
    }

    const idle = now - lastAction;
    const breathing = !reduced && mode === 'browse' && idle > 2.5 ? Math.min(1, (idle - 2.5) / 1.2) : 0;

    for (const cd of cards) {
      let target = 0;
      const isSel = cd === selCard();
      if (mode === 'browse') {
        if (isSel) target = LIFT_PREVIEW;
        const lt = now - (wave.t0 + dist(cd) * 0.06);
        if (lt > 0 && lt < 1.4) {
          const amp = 0.7 * Math.max(0, 1 - dist(cd) * 0.1);
          target += amp * Math.max(0, Math.cos(lt * 8.5)) * Math.exp(-lt * 2.4);
        }
        if (breathing > 0) {
          target += breathing * 0.102 * (0.6 * Math.sin(now * (Math.PI * 2 / 8) + cd.phase) + 0.4 * Math.sin(now * (Math.PI * 2 / 13) + cd.phase * 1.7));
        }
      } else if (isSel) target = mode === 'detail-out' ? LIFT_PREVIEW : LIFT_DETAIL;

      if (reduced) { cd.lift = target; cd.liftV = 0; }
      else [cd.lift, cd.liftV] = spring(cd.lift, cd.liftV, target, dt, 90, 11);
      cd.grp.position.y = cd.lift;

      if (mode === 'detail-out') {
        cd.yaw += (0 - cd.yaw) * Math.min(1, dt * 8);
        if (Math.abs(cd.yaw) < 0.01 && cd.lift < LIFT_PREVIEW + 0.06) {
          mode = 'browse';
          tween({ az: 59, el: 19, r: 36, tx: 0, ty: 0.8, tz: -2 });
          lastAction = now;
        }
      }
      if (mode === 'detail-in' && camT >= 1 && Math.abs(cd.lift - LIFT_DETAIL) < 0.05) mode = 'detail';
      cd.grp.rotation.y = cd.yaw;
    }

    renderer.render(scene, camera);
  }

  function resize() {
    renderer.setSize(innerWidth, innerHeight);
    camera.aspect = innerWidth / innerHeight;
    camera.updateProjectionMatrix();
  }
  addEventListener('resize', resize);

  resize(); place(); hud();
  wave.t0 = clock + 0.4; wave.col = 0; wave.row = 0;
  frame();
  setTimeout(() => bootEl.classList.add('off'), 400);
}

/* ============ 归一化：居中 + 厚度沿 Z + 宽度统一为 5 ============ */
function normalize(src) {
  const b0 = new THREE.Box3().setFromObject(src);
  const s0 = b0.getSize(new THREE.Vector3());
  const order = [['x', s0.x], ['y', s0.y], ['z', s0.z]].sort((a, b) => a[1] - b[1]);
  if (order[0][0] === 'y') src.rotation.x = -Math.PI / 2;
  else if (order[0][0] === 'x') src.rotation.y = Math.PI / 2;
  src.updateMatrixWorld(true);
  const b = new THREE.Box3().setFromObject(src);
  const s = b.getSize(new THREE.Vector3());
  const c = b.getCenter(new THREE.Vector3());
  src.position.sub(c);
  const wrap = new THREE.Group();
  wrap.add(src);
  wrap.scale.setScalar(CARD_W / (s.x || CARD_W));
  return wrap;
}

/* ============ 程序化兜底：GLB 缺失时的近似档案盒 ============ */
function proceduralCard() {
  const g = new THREE.Group();
  const cover = new THREE.Mesh(
    new THREE.BoxGeometry(CARD_W, 3.7, 0.12),
    new THREE.MeshPhysicalMaterial({ color: 0xf5f1ea, roughness: 0.34, transmission: quality.transmission, thickness: 0.6, ior: 1.45, clearcoat: 0.4 })
  );
  cover.position.z = CARD_D / 2;
  const sub = new THREE.Mesh(
    new THREE.BoxGeometry(CARD_W - 0.24, 3.46, CARD_D - 0.16),
    new THREE.MeshStandardMaterial({ color: 0xefe9e0, roughness: 0.8 })
  );
  sub.position.z = -0.04;
  const strip = new THREE.Mesh(
    new THREE.BoxGeometry(0.1, 3.2, 0.06),
    new THREE.MeshStandardMaterial({ color: AMBER, emissive: AMBER, emissiveIntensity: 0.35, roughness: 0.5 })
  );
  strip.position.set(-CARD_W / 2 + 0.32, 0, CARD_D / 2 + 0.03);
  g.add(cover, sub, strip);
  return g;
}
