<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <pattern id="scan3" x="0" y="0" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="#f5f5f5" opacity="0.05"/>
    </pattern>
  </defs>
  <rect width="256" height="256" fill="#0a0a0a"/>
  <rect width="256" height="256" fill="url(#scan3)"/>
  <!-- parallel diagonal slashes (bottom-left to top-right) -->
  <g stroke="#e0b585" fill="none">
    <line x1="-20" y1="236" x2="236" y2="-20" stroke-width="1" opacity="0.18"/>
    <line x1="-20" y1="200" x2="200" y2="-20" stroke-width="1" opacity="0.22"/>
    <line x1="-20" y1="164" x2="164" y2="-20" stroke-width="1" opacity="0.28"/>
    <line x1="-20" y1="92" x2="92" y2="-20" stroke-width="1" opacity="0.28"/>
    <line x1="-20" y1="56" x2="56" y2="-20" stroke-width="1" opacity="0.22"/>
    <line x1="-20" y1="20" x2="20" y2="-20" stroke-width="1" opacity="0.18"/>
    <line x1="20" y1="276" x2="276" y2="20" stroke-width="1" opacity="0.18"/>
    <line x1="56" y1="276" x2="276" y2="56" stroke-width="1" opacity="0.22"/>
    <line x1="92" y1="276" x2="276" y2="92" stroke-width="1" opacity="0.28"/>
    <line x1="164" y1="276" x2="276" y2="164" stroke-width="1" opacity="0.28"/>
    <line x1="200" y1="276" x2="276" y2="200" stroke-width="1" opacity="0.22"/>
    <line x1="236" y1="276" x2="276" y2="236" stroke-width="1" opacity="0.18"/>
  </g>
  <!-- bold accent slashes (amber) -->
  <line x1="-20" y1="182" x2="182" y2="-20" stroke="#e0b585" stroke-width="7"/>
  <line x1="74" y1="276" x2="276" y2="74" stroke="#e0b585" stroke-width="7"/>
  <!-- center accent slash (white) -->
  <line x1="32" y1="224" x2="224" y2="32" stroke="#f5f5f5" stroke-width="3" opacity="0.85"/>
  <!-- accent slash endpoints -->
  <g fill="#e0b585">
    <rect x="-4" y="174" width="8" height="8"/>
    <rect x="176" y="-8" width="8" height="8"/>
    <rect x="68" y="268" width="8" height="8"/>
    <rect x="268" y="68" width="8" height="8"/>
  </g>
  <!-- corner brackets -->
  <path d="M 12 12 L 36 12 M 12 12 L 12 36" stroke="#e0b585" stroke-width="2" fill="none"/>
  <path d="M 244 12 L 220 12 M 244 12 L 244 36" stroke="#e0b585" stroke-width="2" fill="none"/>
  <path d="M 12 244 L 36 244 M 12 244 L 12 220" stroke="#e0b585" stroke-width="2" fill="none"/>
  <path d="M 244 244 L 220 244 M 244 244 L 244 220" stroke="#e0b585" stroke-width="2" fill="none"/>
</svg>
