    <path d="M 148 96 L 148 48 L 200 48 L 200 16"/>
    <path d="M 108 160 L 108 192 L 64 192 L 64 240"/>
    <path d="M 128 160 L 128 240"/>
    <path d="M 148 160 L 148 208 L 200 208 L 200 240"/>
