    <rect x="11" y="187" width="10" height="10"/>
    <rect x="235" y="59" width="10" height="10"/>
    <rect x="235" y="123" width="10" height="10"/>
    <rect x="235" y="187" width="10" height="10"/>
    <rect x="59" y="11" width="10" height="10"/>
    <rect x="123" y="11" width="10" height="10"/>
    <rect x="195" y="11" width="10" height="10"/>
    <rect x="59" y="235" width="10" height="10"/>
    <rect x="123" y="235" width="10" height="10"/>
