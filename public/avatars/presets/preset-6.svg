<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <pattern id="scan6" x="0" y="0" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="#f5f5f5" opacity="0.05"/>
    </pattern>
  </defs>
  <rect width="256" height="256" fill="#0a0a0a"/>
  <rect width="256" height="256" fill="url(#scan6)"/>
  <!-- concentric squares -->
  <rect x="20" y="20" width="216" height="216" fill="none" stroke="#e0b585" stroke-width="1" opacity="0.25"/>
  <rect x="48" y="48" width="160" height="160" fill="none" stroke="#e0b585" stroke-width="1.5" opacity="0.45"/>
  <rect x="80" y="80" width="96" height="96" fill="none" stroke="#e0b585" stroke-width="2" opacity="0.7"/>
  <rect x="108" y="108" width="40" height="40" fill="#e0b585" fill-opacity="0.18" stroke="#e0b585" stroke-width="2.5"/>
  <!-- crosshair lines (with gaps around center) -->
  <line x1="0" y1="128" x2="100" y2="128" stroke="#f5f5f5" stroke-width="1.5" opacity="0.85"/>
  <line x1="156" y1="128" x2="256" y2="128" stroke="#f5f5f5" stroke-width="1.5" opacity="0.85"/>
  <line x1="128" y1="0" x2="128" y2="100" stroke="#f5f5f5" stroke-width="1.5" opacity="0.85"/>
  <line x1="128" y1="156" x2="128" y2="256" stroke="#f5f5f5" stroke-width="1.5" opacity="0.85"/>
  <!-- diagonal crosshair (faint) -->
  <line x1="40" y1="40" x2="92" y2="92" stroke="#e0b585" stroke-width="1" opacity="0.4"/>
  <line x1="216" y1="40" x2="164" y2="92" stroke="#e0b585" stroke-width="1" opacity="0.4"/>
  <line x1="40" y1="216" x2="92" y2="164" stroke="#e0b585" stroke-width="1" opacity="0.4"/>
  <line x1="216" y1="216" x2="164" y2="164" stroke="#e0b585" stroke-width="1" opacity="0.4"/>
  <!-- tick marks on inner square -->
  <g stroke="#e0b585" stroke-width="2">
    <line x1="128" y1="72" x2="128" y2="80"/>
    <line x1="128" y1="176" x2="128" y2="184"/>
    <line x1="72" y1="128" x2="80" y2="128"/>
    <line x1="176" y1="128" x2="184" y2="128"/>
  </g>
  <!-- center node -->
  <rect x="124" y="124" width="8" height="8" fill="#e0b585"/>
  <!-- corner brackets -->
  <path d="M 12 12 L 36 12 M 12 12 L 12 36" stroke="#e0b585" stroke-width="2" fill="none"/>
  <path d="M 244 12 L 220 12 M 244 12 L 244 36" stroke="#e0b585" stroke-width="2" fill="none"/>
  <path d="M 12 244 L 36 244 M 12 244 L 12 220" stroke="#e0b585" stroke-width="2" fill="none"/>
  <path d="M 244 244 L 220 244 M 244 244 L 244 220" stroke="#e0b585" stroke-width="2" fill="none"/>
</svg>
