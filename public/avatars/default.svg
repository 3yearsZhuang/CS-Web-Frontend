<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <pattern id="scanD" x="0" y="0" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="#f5f5f5" opacity="0.04"/>
    </pattern>
  </defs>
  <rect width="256" height="256" fill="#0a0a0a"/>
  <rect width="256" height="256" fill="url(#scanD)"/>
  <!-- outer frame -->
  <rect x="24" y="24" width="208" height="208" fill="none" stroke="#e0b585" stroke-width="1.5" opacity="0.4"/>
  <!-- inner frame -->
  <rect x="40" y="40" width="176" height="176" fill="none" stroke="#e0b585" stroke-width="1" opacity="0.25"/>
  <!-- corner accents (bold) -->
  <path d="M 24 44 L 24 24 L 44 24" fill="none" stroke="#e0b585" stroke-width="3"/>
  <path d="M 212 24 L 232 24 L 232 44" fill="none" stroke="#e0b585" stroke-width="3"/>
  <path d="M 232 212 L 232 232 L 212 232" fill="none" stroke="#e0b585" stroke-width="3"/>
  <path d="M 44 232 L 24 232 L 24 212" fill="none" stroke="#e0b585" stroke-width="3"/>
  <!-- CS monogram (blocky, amber) -->
  <g fill="#e0b585">
    <!-- C: top bar, left bar, bottom bar -->
    <rect x="60" y="88" width="56" height="18"/>
    <rect x="60" y="88" width="18" height="80"/>
    <rect x="60" y="150" width="56" height="18"/>
    <!-- S: top bar, middle bar, bottom bar, upper-right connector, lower-left connector -->
    <rect x="140" y="88" width="56" height="18"/>
    <rect x="140" y="119" width="56" height="18"/>
    <rect x="140" y="150" width="56" height="18"/>
    <rect x="178" y="106" width="18" height="13"/>
    <rect x="140" y="137" width="18" height="13"/>
  </g>
  <!-- bottom accent line -->
  <line x1="80" y1="200" x2="176" y2="200" stroke="#e0b585" stroke-width="2" opacity="0.6"/>
  <!-- top accent line -->
  <line x1="80" y1="56" x2="176" y2="56" stroke="#e0b585" stroke-width="2" opacity="0.6"/>
</svg>
