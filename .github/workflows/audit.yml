name: Security Audit

on:
  push:
    branches: [main, master]
    paths:
      - 'package.json'
      - 'pnpm-lock.yaml'
  pull_request:
    branches: [main, master]
    paths:
      - 'package.json'
      - 'pnpm-lock.yaml'
  # 每周一 UTC 00:00 定期扫描
  schedule:
    - cron: '0 0 * * 1'
  workflow_dispatch:

jobs:
  audit:
    name: pnpm audit (high+)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v5
        with:
          version: 9.0.0

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - name: pnpm audit
        # 显式指定官方 registry：.npmrc 的 npmmirror 无审计端点，否则 job 会以
        # ERR_PNPM_AUDIT_ENDPOINT_NOT_EXISTS 失败（而非真实漏洞检出）。
        # CI 锁定 pnpm@9.0.0 不读取 auditConfig，故 --json 落盘后由 audit-gate.mjs
        # 裁决（豁免登记于 package.json pnpm.auditConfig.ignoreGhsas）。
        run: |
          pnpm audit --audit-level=high --json --registry https://registry.npmjs.org/ > /tmp/audit.json || true
          node tools/scripts/check/audit-gate.mjs /tmp/audit.json
