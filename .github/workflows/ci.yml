name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  # 手动触发：用于运行 E2E 测试等需要完整环境的验证
  workflow_dispatch:
    inputs:
      run_e2e:
        description: '运行 Playwright E2E 测试'
        type: boolean
        default: true

jobs:
  validate:
    name: Type Check + Lint + Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v5
        with:
          version: 9.0.0

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - name: Type Check
        run: pnpm run ts-check

      - name: Lint
        run: pnpm run lint:build

      - name: Test
        run: pnpm test -- --run

  build:
    name: Build Verification
    runs-on: ubuntu-latest
    needs: validate

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v5
        with:
          version: 9.0.0

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build
        env:
          # 构建所需最小环境变量（占位值，不用于运行）
          AUTH_SESSION_SECRET: ci-build-placeholder-secret-32bytes-minimum
          NEXT_PUBLIC_SITE_URL: http://localhost:2333
          ALLOWED_ORIGINS: http://localhost:2333
          PASSWORD_RESET_DEFAULT: CI_BUILD_PLACEHOLDER

      - name: Upload build artifact
        uses: actions/upload-artifact@v5
        if: success()
        with:
          name: build-output
          path: .next/
          retention-days: 3

  security-audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    needs: validate

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v5
        with:
          version: 9.0.0

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - name: Audit (production deps, blocking on moderate+)
        # 显式指定官方 registry：.npmrc 的 npmmirror 无审计端点，否则 job 会以
        # ERR_PNPM_AUDIT_ENDPOINT_NOT_EXISTS 失败（而非真实漏洞检出）。
        run: pnpm audit --prod --audit-level=moderate --registry https://registry.npmjs.org/
        # 1.0 GA 门禁（G1）：中危及以上漏洞强制阻断发布，杜绝"带洞上线"。
        # 误报可用 `pnpm audit` 给出的豁免方式处理；不应再通过 continue-on-error 放行。

      - name: Audit summary
        if: always()
        run: |
          echo "## Dependency Audit" >> $GITHUB_STEP_SUMMARY
          echo "生产依赖审计（moderate+ 阻断）。出现中危以上漏洞时 CI 已失败，须修复或经团队评审豁免后方可合并。" >> $GITHUB_STEP_SUMMARY

  e2e:
    name: E2E Tests (Playwright)
    runs-on: ubuntu-latest
    needs: validate
    # 仅手动触发时运行（E2E 需要完整环境，不在常规 push/PR 中执行）
    if: github.event_name == 'workflow_dispatch' && inputs.run_e2e

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v5
        with:
          version: 9.0.0

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Build
        run: pnpm run build
        env:
          AUTH_SESSION_SECRET: ci-e2e-placeholder-secret-32bytes-minimum
          NEXT_PUBLIC_SITE_URL: http://localhost:2333
          ALLOWED_ORIGINS: http://localhost:2333
          PASSWORD_RESET_DEFAULT: CI_E2E_PLACEHOLDER

      - name: Run E2E tests
        run: pnpm test:e2e --project=chromium
        env:
          AUTH_SESSION_SECRET: ci-e2e-placeholder-secret-32bytes-minimum
          NEXT_PUBLIC_SITE_URL: http://localhost:2333
          ALLOWED_ORIGINS: http://localhost:2333
          PASSWORD_RESET_DEFAULT: CI_E2E_PLACEHOLDER

      - name: Upload E2E report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
