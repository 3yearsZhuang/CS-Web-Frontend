name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  validate:
    name: Type Check + Lint + Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.0.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - name: Type Check
        run: pnpm run ts-check

      - name: Lint
        run: pnpm run lint:build

      - name: Test
        run: pnpm test -- --run

  build:
    name: Build Verification
    runs-on: ubuntu-latest
    needs: validate

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.0.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build
        env:
          # 构建所需最小环境变量（占位值，不用于运行）
          AUTH_SESSION_SECRET: ci-build-placeholder-secret-32bytes-minimum
          NEXT_PUBLIC_SITE_URL: http://localhost:2333
          ALLOWED_ORIGINS: http://localhost:2333
          PASSWORD_RESET_DEFAULT: CI_BUILD_PLACEHOLDER

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: build-output
          path: .next/
          retention-days: 3

  security-audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    needs: validate

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.0.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - name: Audit (production deps, blocking on moderate+)
        run: pnpm audit --prod --audit-level=moderate
        # 1.0 GA 门禁（G1）：中危及以上漏洞强制阻断发布，杜绝"带洞上线"。
        # 误报可用 `pnpm audit` 给出的豁免方式处理；不应再通过 continue-on-error 放行。

      - name: Audit summary
        if: always()
        run: |
          echo "## Dependency Audit" >> $GITHUB_STEP_SUMMARY
          echo "生产依赖审计（moderate+ 阻断）。出现中危以上漏洞时 CI 已失败，须修复或经团队评审豁免后方可合并。" >> $GITHUB_STEP_SUMMARY
