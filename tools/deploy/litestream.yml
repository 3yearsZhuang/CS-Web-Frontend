# ============ Litestream 流式备份配置 ============
# Litestream 实时监控 SQLite WAL 文件，将增量变更流式复制到备份目标。
# 支持 Point-in-Time Recovery（PITR），数据丢失窗口通常 < 1 秒。
#
# 备份目标：本地磁盘路径（默认 deploy/backups/）
#   - 适合 Docker bind mount 持久化备份
#   - 可扩展为 S3/GCS/Azure Blob 等远程存储
#
# 文档：https://litestream.io/reference/config/

dbs:
  # 应用主数据库
  - path: /app/data/app.db
    replicas:
      # --- 本地磁盘备份 ---
      # 生产环境建议将备份目录挂载到独立磁盘或网络存储
      - type: file
        path: /app/backups

      # --- S3 远程备份（可选，取消注释并填写配置） ---
      # - type: s3
      #   bucket: your-bucket-name
      #   path: db-backups
      #   endpoint: https://s3.amazonaws.com  # 或兼容 S3 的服务地址
      #   access-key-id: ${LITESTREAM_ACCESS_KEY_ID}
      #   secret-access-key: ${LITESTREAM_SECRET_ACCESS_KEY}
      #   region: us-east-1

      # --- SFTP 远程备份（可选） ---
      # - type: sftp
      #   host: your-server.com
      #   user: ${LITESTREAM_SFTP_USER}
      #   key-path: /app/litestream-ssh-key
      #   path: /backups/db